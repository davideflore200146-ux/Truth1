name: TRUTH Build

workflows:
android:
name: TRUTH Android
max_build_duration: 30
instance_type: linux_x2
environment:
node: 20
scripts:
- name: Install dependencies
script: |
npm install
- name: Generate Android project
script: |
npx expo prebuild --platform android --clean
- name: Build APK
script: |
cd android
./gradlew assembleRelease
artifacts:
- android/app/build/outputs/apk/release/app-release.apk

ios:
name: TRUTH iOS
max_build_duration: 30
instance_type: mac_mini_m2
environment:
node: 20
scripts:
- name: Install dependencies
script: |
npm install
- name: Generate iOS project
script: |
npx expo prebuild --platform ios --clean
- name: Install CocoaPods
script: |
cd ios
pod install
- name: Build iOS
script: |
xcodebuild
-workspace ios/TRUTH.xcworkspace
-scheme TRUTH
-configuration Release
-sdk iphoneos
-archivePath build/TRUTH.xcarchive
archive
CODE_SIGNING_ALLOWED=NO
CODE_SIGNING_REQUIRED=NO
- name: Create IPA
script: |
mkdir -p build/ipa/Payload
cp -R build/TRUTH.xcarchive/Products/Applications/TRUTH.app build/ipa/Payload/TRUTH.app
cd build/ipa
zip -r ../TRUTH.ipa Payload
artifacts:
- build/TRUTH.ipa
