name: Build TRUTH iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS Archive
        run: |
          xcodebuild \
            -workspace ios/TRUTH.xcworkspace \
            -scheme TRUTH \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath ios/build/TRUTH.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        run: |
          rm -rf ios/build/ipa
          mkdir -p ios/build/ipa/Payload

          cp -R \
            ios/build/TRUTH.xcarchive/Products/Applications/TRUTH.app \
            ios/build/ipa/Payload/TRUTH.app

          cd ios/build/ipa
          zip -r ../TRUTH.ipa Payload

      - name: Check IPA
        run: |
          echo "=== IPA ==="
          ls -lh ios/build/TRUTH.ipa

          echo "=== CONTENT ==="
          unzip -l ios/build/TRUTH.ipa | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TRUTH-IPA
          path: ios/build/TRUTH.ipa
