name: Build TRUTH iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx expo prebuild --platform ios
      
      - run: xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -archivePath ios/build/TRUTH.xcarchive archive CODE_SIGNING_ALLOWED=NO

      - run: |
          mkdir -p Payload
          cp -R ios/build/TRUTH.xcarchive/Products/Applications/Runner.app Payload/TRUTH.app
          zip -r TRUTH.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TRUTH-IPA
          path: TRUTH.ipa
