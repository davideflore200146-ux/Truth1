```yaml
name: Build TRUTH iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Check Generated Files
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la
          echo "=== IOS DIRECTORY ==="
          ls -la ios
          echo "=== XCODE FILES ==="
          find ios -maxdepth 2 \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) -print

      - name: Build iOS
        run: |
          xcodebuild \
            -project ios/TRUTH.xcodeproj \
            -scheme TRUTH \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath ios/build/TRUTH.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R ios/build/TRUTH.xcarchive/Products/Applications/TRUTH.app Payload/TRUTH.app
          cd Payload
          zip -r ../TRUTH.ipa TRUTH.app

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TRUTH-IPA
          path: TRUTH.ipa
```
