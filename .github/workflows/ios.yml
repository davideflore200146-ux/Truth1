name: Build TRUTH iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx expo prebuild --platform ios --clean

      - run: |
          echo "=== IOS ==="
          ls -la ios
          find ios -maxdepth 2 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

      - run: |
          xcodebuild \
            -project ios/TRUTH.xcodeproj \
            -scheme TRUTH \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath ios/build/TRUTH.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - run: |
          rm -rf Payload
          mkdir Payload
          cp -R ios/build/TRUTH.xcarchive/Products/Applications/TRUTH.app Payload/TRUTH.app
          cd Payload
          zip -r ../TRUTH.ipa TRUTH.app

      - uses: actions/upload-artifact@v4
        with:
          name: TRUTH-IPA
          path: TRUTH.ipa
