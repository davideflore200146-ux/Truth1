name: Build TRUTH iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Check generated files
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la
          echo "=== IOS DIRECTORY ==="
          if [ -d ios ]; then
            ls -la ios
          else
            echo "IOS DIRECTORY DOES NOT EXIST"
          fi
          echo "=== XCODE FILES ==="
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"
