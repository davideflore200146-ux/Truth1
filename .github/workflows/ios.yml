name: Build TRUTH iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Check iOS project
        run: |
          echo "=== IOS CONTENT ==="
          find ios -maxdepth 2 -type f | sort
          echo "=== WORKSPACES ==="
          find ios -name "*.xcworkspace" -o -name "*.xcodeproj"

      - name: Build iOS
        run: xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -archivePath ios/build/TRUTH.xcarchive archive CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/TRUTH.xcarchive/Products/Applications/Runner.app Payload/TRUTH.app
          zip -r TRUTH.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TRUTH-IPA
          path: TRUTH.ipa
