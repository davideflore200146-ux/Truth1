name: Build TRUTH Android
on: {workflow_dispatch: {}}
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: 'actions/checkout@v4'}, {uses: 'actions/setup-node@v4', with: {node-version: '20', cache: 'npm'}}, {run: 'npm install'}, {run: 'npx expo prebuild --platform android --clean'}, {run: 'cd android && ./gradlew assembleRelease'}, {run: 'cp android/app/build/outputs/apk/release/app-release.apk android/TRUTH.apk'}, {run: 'ls -lh android/TRUTH.apk'}, {uses: 'actions/upload-artifact@v4', with: {name: 'TRUTH-APK', path: 'android/TRUTH.apk'}}]}}
